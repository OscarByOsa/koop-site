<script>
/* Загрузка кириллического шрифта в jsPDF */
async function loadCyrillicFont(doc) {
  const urls = [
    "https://cdn.jsdelivr.net/gh/googlefonts/roboto@main/src/hinted/Roboto-Regular.ttf",
    "https://raw.githubusercontent.com/googlefonts/roboto/main/src/hinted/Roboto-Regular.ttf"
  ];
  for (const url of urls) {
    try {
      const res = await fetch(url);
      if (!res.ok) continue;
      const buf = await res.arrayBuffer();
      const bytes = new Uint8Array(buf);
      let binary = "";
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      doc.addFileToVFS("Roboto-Regular.ttf", btoa(binary));
      doc.addFont("Roboto-Regular.ttf", "Roboto", "normal");
      return true;
    } catch (e) { console.warn("Шрифт не загружен с", url, e); }
  }
  return false;
}

/* Кэш иконок: id -> dataURL (или null) */
const ICON_CACHE = {};

/* Загрузка одной иконки как dataURL */
async function loadIconDataUrl(id) {
  if (id in ICON_CACHE) return ICON_CACHE[id];
  const url = `assets/ittems/textures/item/${id}.png`;
  try {
    const res = await fetch(url);
    if (!res.ok) { ICON_CACHE[id] = null; return null; }
    const blob = await res.blob();
    const dataUrl = await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
    ICON_CACHE[id] = dataUrl;
    return dataUrl;
  } catch (e) {
    ICON_CACHE[id] = null;
    return null;
  }
}

/* Предзагрузка набора иконок */
async function preloadIcons(ids) {
  await Promise.all(ids.map(id => loadIconDataUrl(id)));
}
</script>

/* ============================================================
   2. СОСТОЯНИЕ
   ============================================================ */
let state = { resources: [], faction: [], players: [] };
let editMode = false;

const statusBanner = document.getElementById("statusBanner");
function setStatus(msg, type = "info", autoHide = 0) {
  statusBanner.textContent = msg;
  statusBanner.className = `status-banner show ${type}`;
  if (autoHide) setTimeout(() => statusBanner.classList.remove("show"), autoHide);
}

/* ============================================================
   3. ХРАНИЛИЩЕ
   ============================================================ */
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state.resources = parsed.resources || JSON.parse(JSON.stringify(DEFAULT_RESOURCES));
      state.faction = parsed.faction || [];
      state.players = parsed.players || [
        { player: "OscarByOsa", role: "Участник фракции", items: [] },
        { player: "Clanzlo",    role: "Участник фракции", items: [] },
        { player: "KORBUT",     role: "Участник фракции", items: [] },
      ];
      return;
    }
  } catch (e) { console.warn("Не удалось загрузить", e); }
  state.resources = JSON.parse(JSON.stringify(DEFAULT_RESOURCES));
  state.faction = [];
  state.players = [
    { player: "OscarByOsa", role: "Участник фракции", items: [] },
    { player: "Clanzlo",    role: "Участник фракции", items: [] },
    { player: "KORBUT",     role: "Участник фракции", items: [] },
  ];
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { setStatus("Не удалось сохранить: " + e.message, "error"); }
}

loadState();

/* ============================================================
   4. УТИЛИТЫ
   ============================================================ */
function iconPath(id) { return `assets/ittems/textures/item/${id}.png`; }
function findResource(id) {
  return state.resources.find(r => r.id === id) || { id, name: id, price: 0, cat: "—", uses: "" };
}
function pluralGayka(n) {
  const abs = Math.abs(n) % 100, last = abs % 10;
  if (abs > 10 && abs < 20) return "гаек";
  if (last === 1) return "гайка";
  if (last >= 2 && last <= 4) return "гайки";
  return "гаек";
}

/* ============================================================
   5. РЕНДЕР КАТАЛОГА
   ============================================================ */
const catalogGrid = document.getElementById("catalogGrid");
const searchInput = document.getElementById("search");
const categoryFilter = document.getElementById("categoryFilter");
const sortBy = document.getElementById("sortBy");

function refreshCategoryOptions() {
  const cats = [...new Set(state.resources.map(r => r.cat).filter(Boolean))].sort();
  const cur = categoryFilter.value;
  categoryFilter.innerHTML = `<option value="">Все категории</option>` +
    cats.map(c => `<option value="${c}">${c}</option>`).join("");
  if (cur && cats.includes(cur)) categoryFilter.value = cur;
}

function renderCatalog() {
  refreshCategoryOptions();
  const q = searchInput.value.trim().toLowerCase();
  const cat = categoryFilter.value;
  let list = state.resources.filter(r => {
    const okQ = r.name.toLowerCase().includes(q) || r.id.toLowerCase().includes(q);
    const okCat = !cat || r.cat === cat;
    return okQ && okCat;
  });
  if (sortBy.value === "priceAsc")  list.sort((a, b) => a.price - b.price);
  if (sortBy.value === "priceDesc") list.sort((a, b) => b.price - a.price);
  if (sortBy.value === "name")      list.sort((a, b) => a.name.localeCompare(b.name, "ru"));

  catalogGrid.innerHTML = list.map(item => `
    <div class="card ${editMode ? "edit-mode" : ""}">
      <div class="actions">
        <button data-edit="${item.id}" title="Редактировать">✎</button>
        <button data-del="${item.id}" class="del" title="Удалить">✕</button>
      </div>
      <img src="${iconPath(item.id)}" alt="${item.name}"
           onerror="this.style.opacity='0.15'; this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2264%22 height=%2264%22><rect width=%2264%22 height=%2264%22 fill=%22%23333%22/><text x=%2232%22 y=%2238%22 font-size=%2210%22 fill=%22%23888%22 text-anchor=%22middle%22>?</text></svg>'">
      <div class="name">${item.name}</div>
      <div class="cat">${item.cat || ""}</div>
      <div class="price">${item.price} ${pluralGayka(item.price)}</div>
      <div class="uses">${item.uses || ""}</div>
    </div>
  `).join("") || `<div class="empty">Ничего не найдено</div>`;

  if (editMode) {
    catalogGrid.querySelectorAll("[data-edit]").forEach(b => {
      b.addEventListener("click", () => openResourceModal(b.dataset.edit));
    });
    catalogGrid.querySelectorAll("[data-del]").forEach(b => {
      b.addEventListener("click", () => {
        if (confirm(`Удалить ресурс «${findResource(b.dataset.del).name}» из каталога?`)) {
          state.resources = state.resources.filter(r => r.id !== b.dataset.del);
          saveState(); renderCatalog(); renderFaction(); renderPlayers();
        }
      });
    });
  }
}
searchInput.addEventListener("input", renderCatalog);
categoryFilter.addEventListener("change", renderCatalog);
sortBy.addEventListener("change", renderCatalog);

/* ============================================================
   6. РЕНДЕР СКЛАДОВ
   ============================================================ */
function renderStockTable(items, searchQuery, editable, kind, ownerIdx) {
  const rows = items
    .map(it => {
      const res = findResource(it.id);
      return { ...it, name: res.name, price: res.price, cat: res.cat };
    })
    .filter(it => !searchQuery
      || it.name.toLowerCase().includes(searchQuery)
      || it.id.toLowerCase().includes(searchQuery));

  const total = rows.reduce((s, it) => s + it.qty * it.price, 0);
  if (rows.length === 0 && !editable) {
    return `<div class="empty-stock">Склад пуст</div>
            <div class="stock-total">Итого: 0 гаек</div>`;
  }

  return `
    <table>
      <thead>
        <tr>
          <th>Ресурс</th><th>Категория</th><th>Цена / шт.</th>
          <th>Количество</th><th>Стоимость</th>
          ${editable ? "<th></th>" : ""}
        </tr>
      </thead>
      <tbody>
        ${rows.length === 0
          ? `<tr><td colspan="${editable ? 6 : 5}" class="empty-stock">Склад пуст</td></tr>`
          : rows.map(it => `
                <tr>
                  <td>${it.name}</td>
                  <td>${it.cat || "—"}</td>
                  <td class="price">${it.price} ${pluralGayka(it.price)}</td>
                  <td class="qty">
                    ${editable
                      ? `<input type="number" min="0" class="edit-input" value="${it.qty}" data-id="${it.id}" data-kind="${kind}" data-owner="${ownerIdx}">`
                      : `${it.qty} шт.`}
                  </td>
                  <td class="total">${it.qty * it.price} ${pluralGayka(it.qty * it.price)}</td>
                  ${editable
                    ? `<td><button class="btn btn-danger" data-remove="${it.id}" data-kind="${kind}" data-owner="${ownerIdx}">✕</button></td>`
                    : ""}
                </tr>
              `).join("")}
      </tbody>
    </table>
    <div class="stock-total">Итого: ${total} ${pluralGayka(total)}</div>
  `;
}

function renderAddBar(kind, ownerIdx, ownerLabel) {
  if (!editMode) return "";
  return `
    <div class="edit-toolbar">
      <select id="addSelect_${kind}_${ownerIdx}">
        <option value="">— Выберите ресурс для «${ownerLabel}» —</option>
        ${state.resources.map(r => `<option value="${r.id}">${r.name} (${r.price} г.)</option>`).join("")}
      </select>
      <input id="addQty_${kind}_${ownerIdx}" type="number" min="1" value="1">
      <button class="btn btn-good" data-add="${kind}" data-owner="${ownerIdx}">+ Добавить</button>
      <button class="btn" data-clear="${kind}" data-owner="${ownerIdx}">Очистить склад</button>
    </div>
  `;
}

const factionWrap = document.getElementById("factionWrap");
const factionEditBar = document.getElementById("factionEditBar");
const searchFaction = document.getElementById("searchFaction");

function renderFaction() {
  factionEditBar.innerHTML = renderAddBar("faction", 0, "Склад фракции");
  factionWrap.innerHTML = renderStockTable(
    state.faction,
    searchFaction.value.trim().toLowerCase(),
    editMode, "faction", 0
  );
  if (editMode) bindStockEvents("faction", 0);
}

const playersWrap = document.getElementById("playersWrap");
const searchPlayers = document.getElementById("searchPlayers");

function renderPlayers() {
  const q = searchPlayers.value.trim().toLowerCase();
  let html = "";
  state.players.forEach((p, idx) => {
    if (q && !p.items.length && !p.player.toLowerCase().includes(q)) return;
    html += `
      <div class="stock-block" data-player-idx="${idx}">
        <div class="stock-header">
          <h3>${p.player} <span class="badge">${p.role}</span></h3>
          ${editMode ? `<button class="btn btn-danger" data-del-player="${idx}">Удалить игрока</button>` : ""}
        </div>
        ${renderAddBar("player", idx, p.player)}
        ${renderStockTable(p.items, q, editMode, "player", idx)}
      </div>
    `;
  });
  playersWrap.innerHTML = html || `<div class="empty">Ничего не найдено</div>`;
  if (editMode) {
    state.players.forEach((p, idx) => {
      if (q && !p.items.length && !p.player.toLowerCase().includes(q)) return;
      bindStockEvents("player", idx);
    });
    playersWrap.querySelectorAll("[data-del-player]").forEach(b => {
      b.addEventListener("click", () => {
        const i = parseInt(b.dataset.delPlayer, 10);
        if (confirm(`Удалить игрока ${state.players[i].player}?`)) {
          state.players.splice(i, 1);
          saveState(); renderPlayers();
        }
      });
    });
  }
}

function bindStockEvents(kind, ownerIdx) {
  let wrapEl, editBar;
  if (kind === "faction") {
    wrapEl = factionWrap; editBar = factionEditBar;
  } else {
    const block = playersWrap.querySelector(`[data-player-idx="${ownerIdx}"]`);
    if (!block) return;
    wrapEl = block;
    editBar = block.querySelector(".edit-toolbar");
  }
  if (!wrapEl) return;

  wrapEl.querySelectorAll(".edit-input").forEach(inp => {
    inp.addEventListener("change", () => {
      const id = inp.dataset.id;
      let val = parseInt(inp.value, 10);
      if (isNaN(val) || val < 0) val = 0;
      inp.value = val;
      const items = kind === "faction" ? state.faction : state.players[ownerIdx].items;
      const item = items.find(i => i.id === id);
      if (item) { item.qty = val; saveState(); kind === "faction" ? renderFaction() : renderPlayers(); }
    });
  });

  wrapEl.querySelectorAll("[data-remove]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.remove;
      if (kind === "faction") state.faction = state.faction.filter(i => i.id !== id);
      else state.players[ownerIdx].items = state.players[ownerIdx].items.filter(i => i.id !== id);
      saveState(); kind === "faction" ? renderFaction() : renderPlayers();
    });
  });

  if (editBar) {
    const addBtn = editBar.querySelector("[data-add]");
    if (addBtn) addBtn.addEventListener("click", () => {
      const sel = editBar.querySelector("select");
      const qty = editBar.querySelector('input[type="number"]');
      const id = sel.value;
      const count = parseInt(qty.value, 10);
      if (!id || !count || count <= 0) return;
      const items = kind === "faction" ? state.faction : state.players[ownerIdx].items;
      const existing = items.find(i => i.id === id);
      if (existing) existing.qty += count;
      else items.push({ id, qty: count });
      saveState(); kind === "faction" ? renderFaction() : renderPlayers();
    });

    const clearBtn = editBar.querySelector("[data-clear]");
    if (clearBtn) clearBtn.addEventListener("click", () => {
      if (!confirm("Очистить склад?")) return;
      if (kind === "faction") state.faction.length = 0;
      else state.players[ownerIdx].items = [];
      saveState(); kind === "faction" ? renderFaction() : renderPlayers();
    });
  }
}

searchFaction.addEventListener("input", renderFaction);
searchPlayers.addEventListener("input", renderPlayers);

function openResourceModal(editId = null) {
  const isEdit = editId !== null;
  const r = isEdit ? findResource(editId) : { id: "", name: "", price: 1, cat: "", uses: "" };
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML = `
    <div class="modal">
      <h2>${isEdit ? "Редактировать ресурс" : "Новый ресурс"}</h2>
      <label>ID (имя файла иконки)</label>
      <input id="rId" type="text" value="${r.id}" ${isEdit ? "disabled" : ""} placeholder="например stvol_vintovka">
      <label>Название</label>
      <input id="rName" type="text" value="${r.name}" placeholder="Винтовочный ствол">
      <label>Цена за 1 шт. (гайки)</label>
      <input id="rPrice" type="number" min="0" step="1" value="${r.price}">
      <label>Категория</label>
      <input id="rCat" type="text" value="${r.cat}" placeholder="Оружие / Патроны / Броня / ...">
      <label>Подсказка (где используется)</label>
      <input id="rUses" type="text" value="${r.uses}" placeholder="необязательно">
      <div class="modal-error" id="mErr"></div>
      <div class="modal-buttons">
        <button class="btn" id="mCancel">Отмена</button>
        <button class="btn btn-good" id="mSave">Сохранить</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);
  const close = () => document.body.removeChild(backdrop);
  backdrop.querySelector("#mCancel").addEventListener("click", close);
  backdrop.querySelector("#mSave").addEventListener("click", () => {
    const id = backdrop.querySelector("#rId").value.trim();
    const name = backdrop.querySelector("#rName").value.trim();
    const price = parseInt(backdrop.querySelector("#rPrice").value, 10);
    const cat = backdrop.querySelector("#rCat").value.trim();
    const uses = backdrop.querySelector("#rUses").value.trim();
    const err = backdrop.querySelector("#mErr");
    if (!id) { err.textContent = "ID обязателен"; return; }
    if (!name) { err.textContent = "Название обязательно"; return; }
    if (isNaN(price) || price < 0) { err.textContent = "Цена должна быть числом ≥ 0"; return; }
    if (!isEdit && state.resources.some(x => x.id === id)) {
      err.textContent = "Ресурс с таким ID уже существует"; return;
    }
    if (isEdit) {
      const existing = state.resources.find(x => x.id === editId);
      if (existing) { existing.name = name; existing.price = price; existing.cat = cat; existing.uses = uses; }
    } else {
      state.resources.push({ id, name, price, cat, uses });
    }
    saveState(); close(); renderCatalog(); renderFaction(); renderPlayers();
  });
  backdrop.querySelector("#rId").focus();
}

      <h2>Новый игрок</h2>
      <label>Ник</label>
      <input id="pNick" type="text" placeholder="например Ivan_Torg">
      <label>Роль</label>
      <input id="pRole" type="text" value="Участник фракции">
      <div class="modal-error" id="mErr"></div>
      <div class="modal-buttons">
        <button class="btn" id="mCancel">Отмена</button>
        <button class="btn btn-good" id="mSave">Создать</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);
  const close = () => document.body.removeChild(backdrop);
  backdrop.querySelector("#mCancel").addEventListener("click", close);
  backdrop.querySelector("#mSave").addEventListener("click", () => {
    const nick = backdrop.querySelector("#pNick").value.trim();
    const role = backdrop.querySelector("#pRole").value.trim() || "Участник фракции";

}

document.getElementById("exportJsonBtn").addEventListener("click", () => {
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `koop-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  setStatus("JSON-резервная копия скачана", "success", 3000);
});

document.getElementById("importBtn").addEventListener("click", () => {
  const input = document.createElement("input");
  input.type = "file"; input.accept = ".json";
  input.addEventListener("change", () => {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (!parsed.resources || !parsed.faction || !parsed.players) {
          throw new Error("Неверный формат файла");
        }
        if (!confirm("Заменить текущие данные импортированными?")) return;
        state = parsed;
        saveState(); renderCatalog(); renderFaction(); renderPlayers();
        setStatus("Импорт выполнен", "success", 3000);
      } catch (err) {
        setStatus("Ошибка импорта: " + err.message, "error");
      }
    };
    reader.readAsText(file);
  });
  input.click();
});

/* ============================================================
   11. ЭКСПОРТ КАТАЛОГА В PDF (с иконками, по категориям)
   ============================================================ */
document.getElementById("exportCatalogPdf").addEventListener("click", async () => {
  const btn = document.getElementById("exportCatalogPdf");
  btn.disabled = true; btn.textContent = "⏳ Генерация…";
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: "p", unit: "mm", format: "a4" });
    const fontOk = await loadCyrillicFont(doc);
    if (!fontOk) { setStatus("Не удалось загрузить шрифт для PDF", "error"); return; }
    doc.setFont("Roboto");

    // Подгружаем иконки заранее
    setStatus("Загрузка иконок…", "info");
    await preloadIcons(state.resources.map(r => r.id));
    setStatus("Генерация PDF…", "info");

    const ICON_SIZE = 6;          // мм
    const ROW_HEIGHT = 8;         // мм (высота строки таблицы)

    doc.setFontSize(16);
    doc.text("Кооператив — Каталог ресурсов", 14, 18);
    doc.setFontSize(9);
    doc.setTextColor(120);
    doc.text(`Сгенерировано: ${new Date().toLocaleString("ru-RU")}`, 14, 24);
    doc.setTextColor(0);

    let cursorY = 32;
    const pageHeight = doc.internal.pageSize.getHeight();
    const pageWidth = doc.internal.pageSize.getWidth();

    // Группировка по категориям
    const byCat = {};
    state.resources.forEach(r => {
      const c = r.cat || "Без категории";
      if (!byCat[c]) byCat[c] = [];
      byCat[c].push(r);
    });
    const cats = Object.keys(byCat).sort((a, b) => a.localeCompare(b, "ru"));

    // Заголовки и строки
    const head = [["", "Ресурс", "Цена, гайки", "Используется в"]];
    const colWidths = { 0: 10, 1: 80, 2: 30, 3: "auto" };

    for (let ci = 0; ci < cats.length; ci++) {
      const cat = cats[ci];
      const items = byCat[cat].sort((a, b) => a.name.localeCompare(b.name, "ru"));

      // Проверим, поместится ли заголовок категории + хотя бы одна строка
      if (cursorY + 18 > pageHeight - 15) {
        doc.addPage();
        cursorY = 20;
      }

      // Заголовок категории
      doc.setFontSize(12);
      doc.setTextColor(212, 160, 23);
      doc.text(`▸ ${cat}`, 14, cursorY);
      doc.setTextColor(0);
      cursorY += 4;

      // Таблица без иконок, чтобы получить координаты строк
      const tableStartY = cursorY;
      doc.autoTable({
        startY: tableStartY,
        head: head,
        body: items.map(r => ["", r.name, `${r.price}`, r.uses || "—"]),
        styles: { font: "Roboto", fontSize: 8, cellPadding: 1.5, minCellHeight: ROW_HEIGHT },
        headStyles: { font: "Roboto", fillColor: [212, 160, 23], textColor: 20, fontStyle: "bold" },
        alternateRowStyles: { fillColor: [245, 245, 245] },
        columnStyles: {
          0: { cellWidth: 10, halign: "center" },
          1: { cellWidth: 80 },
          2: { cellWidth: 30, halign: "right" },
          3: { cellWidth: "auto" },
        },
        margin: { left: 14, right: 14 },
        didDrawCell: (data) => {
          // Вставляем иконку в 0-ю колонку (после отрисовки ячейки)
          if (data.section === "body" && data.column.index === 0) {
            const resource = items[data.row.index];
            const dataUrl = ICON_CACHE[resource.id];
            if (dataUrl) {
              const x = data.cell.x + (data.cell.width - ICON_SIZE) / 2;
              const y = data.cell.y + (data.cell.height - ICON_SIZE) / 2;
              try {
                doc.addImage(dataUrl, "PNG", x, y, ICON_SIZE, ICON_SIZE);
              } catch (e) { /* пропускаем битую картинку */ }
            }
          }
        },
        didDrawPage: (data) => {
          doc.setFont("Roboto");
          doc.setFontSize(8);
          doc.setTextColor(120);
          doc.text(
            `Страница ${data.pageNumber}`,
            pageWidth - 20,
            pageHeight - 8
          );
          doc.setTextColor(0);
        }
      });

      cursorY = doc.lastAutoTable.finalY + 6;
    }

    doc.save(`koop-catalog-${new Date().toISOString().slice(0,10)}.pdf`);
    setStatus("PDF-каталог сгенерирован", "success", 3000);
  } catch (e) {
    console.error(e);
    setStatus("Ошибка генерации PDF: " + e.message, "error");
  } finally {
    btn.disabled = false; btn.textContent = "📄 PDF";
  }
});

/* ============================================================

   ============================================================ */
async function exportStocksPdf() {
  const btn1 = document.getElementById("exportStocksPdf");
  const btn2 = document.getElementById("exportStocksPdf2");
  btn1.disabled = btn2.disabled = true;
  btn1.textContent = btn2.textContent = "⏳ Генерация…";
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: "p", unit: "mm", format: "a4" });
    const fontOk = await loadCyrillicFont(doc);
    if (!fontOk) { setStatus("Не удалось загрузить шрифт для PDF", "error"); return; }
    doc.setFont("Roboto");

    // Предзагрузка всех нужных иконок
    setStatus("Загрузка иконок…", "info");
    const allIds = new Set();
    state.faction.forEach(it => allIds.add(it.id));
    state.players.forEach(p => p.items.forEach(it => allIds.add(it.id)));
    await preloadIcons([...allIds]);
    setStatus("Генерация PDF…", "info");

    const ICON_SIZE = 5;    // мм
    const ROW_HEIGHT = 7;   // мм
    const pageHeight = doc.internal.pageSize.getHeight();
    const pageWidth = doc.internal.pageSize.getWidth();

    let y = 18;
    doc.setFontSize(16);
    doc.text("Кооператив — Склады", 14, y);
    y += 6;
    doc.setFontSize(9);
    doc.setTextColor(120);
    doc.text(`Сгенерировано: ${new Date().toLocaleString("ru-RU")}`, 14, y);
    doc.setTextColor(0);
    y += 8;

    function drawStockBlock(title, items, startY) {
      // Иконки в таблице, сортировка по категории/названию
      const sorted = [...items].sort((a, b) => {
        const ra = findResource(a.id), rb = findResource(b.id);
        const ca = (ra.cat || "—"), cb = (rb.cat || "—");
        if (ca !== cb) return ca.localeCompare(cb, "ru");
        return ra.name.localeCompare(rb.name, "ru");
      });

      const total = sorted.reduce((s, it) => {
        const r = findResource(it.id); return s + it.qty * r.price;
      }, 0);

      doc.setFont("Roboto");
      doc.setFontSize(12);
      doc.setTextColor(212, 160, 23);
      doc.text(title, 14, startY);
      doc.setTextColor(0);

      if (sorted.length === 0) {
        doc.setFontSize(9);
        doc.setTextColor(150);
        doc.text("Склад пуст", 18, startY + 6);
        doc.setTextColor(0);
        return startY + 14;
      }

      const body = sorted.map(it => {
        const r = findResource(it.id);
        return ["", r.name, r.cat || "—", `${r.price}`, `${it.qty}`, `${it.qty * r.price}`];
      });

      doc.autoTable({
        startY: startY + 4,
        head: [["", "Ресурс", "Категория", "Цена", "Кол-во", "Стоимость"]],
        body: body,
        foot: [["", "Итого", "", "", "", `${total} г.`]],
        styles: { font: "Roboto", fontSize: 8, cellPadding: 1.3, minCellHeight: ROW_HEIGHT },
        headStyles: { font: "Roboto", fillColor: [212, 160, 23], textColor: 20, fontStyle: "bold" },
        footStyles: { font: "Roboto", fillColor: [36, 36, 36], textColor: [240, 192, 64], fontStyle: "bold" },
        alternateRowStyles: { fillColor: [245, 245, 245] },
        columnStyles: {
          0: { cellWidth: 8, halign: "center" },
          1: { cellWidth: 65 },
          2: { cellWidth: 32 },
          3: { cellWidth: 20, halign: "right" },
          4: { cellWidth: 20, halign: "right" },
          5: { cellWidth: "auto", halign: "right" },
        },
        margin: { left: 14, right: 14 },
        didDrawCell: (data) => {
          if (data.section === "body" && data.column.index === 0) {
            const resource = findResource(sorted[data.row.index].id);
            const dataUrl = ICON_CACHE[resource.id];
            if (dataUrl) {
              const x = data.cell.x + (data.cell.width - ICON_SIZE) / 2;
              const y2 = data.cell.y + (data.cell.height - ICON_SIZE) / 2;
              try {
                doc.addImage(dataUrl, "PNG", x, y2, ICON_SIZE, ICON_SIZE);
              } catch (e) {}
            }
          }
        },
        didDrawPage: (data) => {
          doc.setFont("Roboto");
          doc.setFontSize(8);
          doc.setTextColor(120);
          doc.text(`Страница ${data.pageNumber}`, pageWidth - 20, pageHeight - 8);
          doc.setTextColor(0);
        }
      });

      return doc.lastAutoTable.finalY + 8;
    }

    y = drawStockBlock("Склад фракции", state.faction, y);
    state.players.forEach(p => {
      if (y > 240) { doc.addPage(); y = 20; }
      y = drawStockBlock(`Склад: ${p.player} (${p.role})`, p.items, y);
    });

    doc.save(`koop-stocks-${new Date().toISOString().slice(0,10)}.pdf`);
    setStatus("PDF-склады сгенерированы", "success", 3000);
  } catch (e) {
    console.error(e);
    setStatus("Ошибка генерации PDF: " + e.message, "error");
  } finally {
    btn1.disabled = btn2.disabled = false;
    btn1.textContent = "📄 PDF"; btn2.textContent = "📄 PDF";
  }
}
document.getElementById("exportStocksPdf").addEventListener("click", exportStocksPdf);
document.getElementById("exportStocksPdf2").addEventListener("click", exportStocksPdf);

/* ============================================================
   14. ЭКСПОРТ СКЛАДОВ В EXCEL
   ============================================================ */
function exportStocksXlsx() {
  const wb = XLSX.utils.book_new();
  function addSheet(name, items) {
    const rows = items
      .map(it => {
        const r = findResource(it.id);
        return [r.name, r.cat || "—", r.price, it.qty, it.qty * r.price];
      })
      .sort((a, b) => {
        if (a[1] !== b[1]) return String(a[1]).localeCompare(String(b[1]), "ru");
        return String(a[0]).localeCompare(String(b[0]), "ru");
      });
    const total = items.reduce((s, it) => {
      const r = findResource(it.id); return s + it.qty * r.price;
    }, 0);
    const data = [
      ["Ресурс", "Категория", "Цена за 1 шт.", "Количество", "Стоимость"],
      ...rows,
      ["", "", "", "ИТОГО:", total]
    ];
    const ws = XLSX.utils.aoa_to_sheet(data);
    ws["!cols"] = [{ wch: 35 }, { wch: 14 }, { wch: 16 }, { wch: 12 }, { wch: 14 }];
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
  }
  addSheet("Фракция", state.faction);
  state.players.forEach(p => addSheet(p.player, p.items));
  XLSX.writeFile(wb, `koop-stocks-${new Date().toISOString().slice(0,10)}.xlsx`);
  setStatus("Excel-склады сгенерированы", "success", 3000);
}
document.getElementById("exportStocksXlsx").addEventListener("click", exportStocksXlsx);
document.getElementById("exportStocksXlsx2").addEventListener("click", exportStocksXlsx);
